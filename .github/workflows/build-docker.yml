# Test that the Dockerfile builds successfully.
# The image builds the current Python package and its bundled native extension from source.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - native/**
      - src/**
      - pyproject.toml
      - docker-entrypoint.sh
      - .github/workflows/build-docker.yml
  pull_request:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - native/**
      - src/**
      - pyproject.toml
      - docker-entrypoint.sh
      - .github/workflows/build-docker.yml
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          push: false
