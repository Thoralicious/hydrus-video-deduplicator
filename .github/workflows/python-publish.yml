name: Upload Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run : |
          python -m pip install uv
          uv venv
          uv pip install hatch

      - name: Build package without Hatch to make sure it works
        run: uv build && rm -rf dist

      - name: Build sdist
        run: uv run hatch build --clean --target sdist dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build native wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.0
      env:
        CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
        CIBW_SKIP: "*-musllinux_* *-win32"
        CIBW_ARCHS: auto64
        CIBW_TEST_COMMAND: "python -c \"from hydrusvideodeduplicator import _native; assert _native.matchHashBytes(bytes(32), bytes(32), 31) == 100\""
    - uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  deploy:
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/hydrusvideodeduplicator
    permissions:
      contents: read
      id-token: write # this permission is mandatory for Trusted Publishing
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist/
        merge-multiple: true

    - name: Display downloaded packages
      run: ls -R dist/

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@2442bad8f54b06a326f3030ef5e6a7a674118557
